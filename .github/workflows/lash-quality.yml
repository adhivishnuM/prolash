name: Lash mirror quality

on:
  pull_request:
  push:
    branches: [main, 'feat/premium-lash-try-on']

permissions:
  contents: read

concurrency:
  group: lash-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run ar:verify
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lash-mirror-browser-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
